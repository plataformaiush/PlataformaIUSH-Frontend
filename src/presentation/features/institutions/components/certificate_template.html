<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Certificado</title>
<style>


  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--color-background);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  .certificate-wrapper {
    width: 1240px;
    height: 1754px;
    position: relative;
    flex-shrink: 0;
  }

  .certificate {
    width: 1240px;
    height: 1754px;
    background-color: var(--color-background);
    position: absolute;
    top: 0;
    left: 0;
    overflow: hidden;
  }

  /* ── Outer decorative border ── */
  .border-outer {
    position: absolute;
    top: 28px;
    left: 28px;
    right: 28px;
    bottom: 28px;
    border: 3px solid var(--color-primary);
  }

  /* ── Inner decorative border ── */
  .border-inner {
    position: absolute;
    top: 42px;
    left: 42px;
    right: 42px;
    bottom: 42px;
    border: 1px solid var(--color-secondary);
  }

  /* ── Corner ornaments ── */
  .corner {
    position: absolute;
    width: 60px;
    height: 60px;
  }
  .corner svg {
    width: 60px;
    height: 60px;
  }
  .corner-tl { top: 18px; left: 18px; }
  .corner-tr { top: 18px; right: 18px; transform: scaleX(-1); }
  .corner-bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
  .corner-br { bottom: 18px; right: 18px; transform: scale(-1); }

  /* ── Top color band ── */
  .top-band {
    position: absolute;
    top: 56px;
    left: 56px;
    right: 56px;
    height: 8px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-secondary), var(--color-tertiary), var(--color-secondary), var(--color-primary));
  }

  /* ── Bottom color band ── */
  .bottom-band {
    position: absolute;
    bottom: 56px;
    left: 56px;
    right: 56px;
    height: 8px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-secondary), var(--color-tertiary), var(--color-secondary), var(--color-primary));
  }

  /* ── Watermark logo ── */
  .watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    height: 520px;
    opacity: 0.06;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .watermark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: grayscale(100%);
  }

  /* ── Logo header ── */
  .logo-header {
    position: absolute;
    top: 90px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90px;
  }
  .logo-header img {
    max-height: 80px;
    max-width: 240px;
    object-fit: contain;
  }

  /* ── Divider line under logo ── */
  .divider-top {
    position: absolute;
    top: 200px;
    left: 120px;
    right: 120px;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: var(--color-secondary);
  }
  .divider-diamond {
    width: 8px;
    height: 8px;
    background: var(--color-primary);
    transform: rotate(45deg);
    flex-shrink: 0;
    margin: 0 10px;
  }

  /* ── "CERTIFICADO" title ── */
  .cert-title {
    position: absolute;
    top: 228px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 72px;
    font-weight: bold;
    letter-spacing: 18px;
    color: var(--color-primary);
    text-transform: uppercase;
  }

  /* ── Subtitle ornament ── */
  .cert-subtitle-ornament {
    position: absolute;
    top: 332px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 18px;
    letter-spacing: 6px;
    color: var(--color-secondary);
    text-transform: uppercase;
  }

  /* ── Divider under title ── */
  .divider-mid {
    position: absolute;
    top: 376px;
    left: 120px;
    right: 120px;
    display: flex;
    align-items: center;
  }

  /* ── Intro text ── */
  .cert-intro {
    position: absolute;
    top: 420px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 26px;
    color: var(--color-muted-foreground);
    font-style: italic;
    letter-spacing: 1px;
  }

  /* ── Recipient name ── */
  .cert-name {
    position: absolute;
    top: 490px;
    left: 100px;
    right: 100px;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 86px;
    font-weight: bold;
    color: var(--color-primary);
    line-height: 1.1;
    word-break: break-word;
  }

  /* ── Name underline ── */
  .name-underline {
    position: absolute;
    top: 638px;
    left: 180px;
    right: 180px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--color-secondary), transparent);
  }

  /* ── "ha completado satisfactoriamente" ── */
  .cert-connective {
    position: absolute;
    top: 658px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 24px;
    color: var(--color-muted-foreground);
    font-style: italic;
  }

  /* ── Course ── */
  .cert-course-label {
    position: absolute;
    top: 710px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 16px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--color-secondary);
  }

  .cert-course {
    position: absolute;
    top: 748px;
    left: 120px;
    right: 120px;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 46px;
    font-weight: bold;
    color: var(--color-foreground);
    line-height: 1.2;
    word-break: break-word;
  }

  /* ── Date section ── */
  .cert-date-divider {
    position: absolute;
    top: 910px;
    left: 400px;
    right: 400px;
    height: 1px;
    background: var(--color-border);
  }

  .cert-date-label {
    position: absolute;
    top: 928px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--color-secondary);
  }

  .cert-date {
    position: absolute;
    top: 960px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 28px;
    color: var(--color-foreground);
    letter-spacing: 2px;
  }

  /* ── Decorative seal circle ── */
  .seal {
    position: absolute;
    top: 1040px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 160px;
  }
  .seal svg {
    width: 160px;
    height: 160px;
  }

  /* ── Signatures area ── */
  .signatures {
    position: absolute;
    bottom: 130px;
    left: 100px;
    right: 100px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .signature-block {
    width: 340px;
    text-align: center;
  }

  .signature-line {
    width: 100%;
    height: 1px;
    background: var(--color-foreground);
    margin-bottom: 10px;
  }

  .signature-name {
    font-family: 'Georgia', serif;
    font-size: 20px;
    font-weight: bold;
    color: var(--color-foreground);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .signature-role {
    font-family: 'Georgia', serif;
    font-size: 14px;
    color: var(--color-muted-foreground);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── Print styles ── */
  @media print {
    body {
      background: none;
      padding: 0;
    }
    .certificate-wrapper,
    .certificate {
      width: 1240px;
      height: 1754px;
    }
  }
</style>
</head>
<body>

<div class="certificate-wrapper">
  <div class="certificate">

    <!-- Watermark -->
    <div class="watermark">
      <img src="{{logo}}" alt="Marca de agua institucional" onerror="this.style.display='none'" />
    </div>

    <!-- Outer border -->
    <div class="border-outer"></div>

    <!-- Inner border -->
    <div class="border-inner"></div>

    <!-- Corner ornaments -->
    <div class="corner corner-tl">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4 L4 56" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L56 4" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L22 22" stroke="var(--color-secondary)" stroke-width="1.5"/>
        <circle cx="4" cy="4" r="4" fill="var(--color-primary)"/>
        <circle cx="22" cy="4" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <circle cx="4" cy="22" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <rect x="10" y="10" width="6" height="6" fill="var(--color-tertiary)" transform="rotate(45 13 13)"/>
      </svg>
    </div>
    <div class="corner corner-tr">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4 L4 56" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L56 4" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L22 22" stroke="var(--color-secondary)" stroke-width="1.5"/>
        <circle cx="4" cy="4" r="4" fill="var(--color-primary)"/>
        <circle cx="22" cy="4" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <circle cx="4" cy="22" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <rect x="10" y="10" width="6" height="6" fill="var(--color-tertiary)" transform="rotate(45 13 13)"/>
      </svg>
    </div>
    <div class="corner corner-bl">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4 L4 56" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L56 4" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L22 22" stroke="var(--color-secondary)" stroke-width="1.5"/>
        <circle cx="4" cy="4" r="4" fill="var(--color-primary)"/>
        <circle cx="22" cy="4" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <circle cx="4" cy="22" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <rect x="10" y="10" width="6" height="6" fill="var(--color-tertiary)" transform="rotate(45 13 13)"/>
      </svg>
    </div>
    <div class="corner corner-br">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4 L4 56" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L56 4" stroke="var(--color-primary)" stroke-width="2.5"/>
        <path d="M4 4 L22 22" stroke="var(--color-secondary)" stroke-width="1.5"/>
        <circle cx="4" cy="4" r="4" fill="var(--color-primary)"/>
        <circle cx="22" cy="4" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <circle cx="4" cy="22" r="3" fill="var(--color-secondary)" opacity="0.5"/>
        <rect x="10" y="10" width="6" height="6" fill="var(--color-tertiary)" transform="rotate(45 13 13)"/>
      </svg>
    </div>

    <!-- Color bands -->
    <div class="top-band"></div>
    <div class="bottom-band"></div>

    <!-- Logo header -->
    <div class="logo-header">
      <img src="{{logo}}" alt="Logo institucional" onerror="this.style.display='none'" />
    </div>

    <!-- Divider under logo -->
    <div class="divider-top">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <!-- Title -->
    <div class="cert-title">Certificado</div>
    <div class="cert-subtitle-ornament">de participación</div>

    <!-- Divider mid -->
    <div class="divider-mid">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>

    <!-- Intro -->
    <div class="cert-intro">La institución certifica que</div>

    <!-- Recipient name -->
    <div class="cert-name">{{nombre}}</div>

    <!-- Name underline -->
    <div class="name-underline"></div>

    <!-- Connective text -->
    <div class="cert-connective">ha completado satisfactoriamente el curso</div>

    <!-- Course label + value -->
    <div class="cert-course-label">Programa académico</div>
    <div class="cert-course">{{curso}}</div>

    <!-- Date -->
    <div class="cert-date-divider"></div>
    <div class="cert-date-label">Fecha de emisión</div>
    <div class="cert-date">{{fecha}}</div>

    <!-- Decorative seal -->
    <div class="seal">
      <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="80" cy="80" r="74" stroke="var(--color-primary)" stroke-width="2"/>
        <circle cx="80" cy="80" r="66" stroke="var(--color-secondary)" stroke-width="1"/>
        <circle cx="80" cy="80" r="58" stroke="var(--color-tertiary)" stroke-width="1.5"/>
        <circle cx="80" cy="80" r="44" fill="var(--color-primary)" opacity="0.06"/>
        <!-- Star / asterisk decoration -->
        <line x1="80" y1="36" x2="80" y2="124" stroke="var(--color-secondary)" stroke-width="1" opacity="0.4"/>
        <line x1="36" y1="80" x2="124" y2="80" stroke="var(--color-secondary)" stroke-width="1" opacity="0.4"/>
        <line x1="51" y1="51" x2="109" y2="109" stroke="var(--color-secondary)" stroke-width="1" opacity="0.3"/>
        <line x1="109" y1="51" x2="51" y2="109" stroke="var(--color-secondary)" stroke-width="1" opacity="0.3"/>
        <!-- Center diamond -->
        <rect x="72" y="72" width="16" height="16" fill="var(--color-primary)" transform="rotate(45 80 80)" opacity="0.7"/>
        <!-- Small dots on circle -->
        <circle cx="80" cy="6" r="3" fill="var(--color-secondary)"/>
        <circle cx="80" cy="154" r="3" fill="var(--color-secondary)"/>
        <circle cx="6" cy="80" r="3" fill="var(--color-secondary)"/>
        <circle cx="154" cy="80" r="3" fill="var(--color-secondary)"/>
      </svg>
    </div>

    <!-- Signatures -->
    <div class="signatures">
      <div class="signature-block">
        <div class="signature-line"></div>
        <div class="signature-name">{{firma1}}</div>
        <div class="signature-role">Firma &amp; cargo</div>
      </div>
      <div class="signature-block">
        <div class="signature-line"></div>
        <div class="signature-name">{{firma2}}</div>
        <div class="signature-role">Firma &amp; cargo</div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
